# Exercises sampletype = csv (per-row metadata), the windbag generator,
# randomizeEvents, bundlelines, mvfile/seqfile/static/integerid tokens and a
# custom breaker with multi-line events.

[rows.csv]
mode = sample
sampletype = csv
interval = 1
count = 6
earliest = -2s
latest = now
token.0.token = TS=(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})
token.0.replacementType = timestamp
token.0.replacement = %Y-%m-%d %H:%M:%S
token.1.token = USER=(\w+)
token.1.replacementType = mvfile
token.1.replacement = samples/users.sample:1
token.2.token = CITY=(\w+)
token.2.replacementType = mvfile
token.2.replacement = samples/users.sample:2
token.3.token = SEQ=(\d+)
token.3.replacementType = integerid
token.3.replacement = 100
token.4.token = TAG=(\w+)
token.4.replacementType = static
token.4.replacement = fixed

[multi.log]
mode = sample
interval = 1
count = 4
breaker = ^BEGIN
randomizeEvents = true
earliest = -1s
latest = now
token.0.token = BEGIN (\d{2}:\d{2}:\d{2})
token.0.replacementType = timestamp
token.0.replacement = %H:%M:%S
token.1.token = code=(\d{3})
token.1.replacementType = seqfile
token.1.replacement = samples/codes.sample

[wind]
generator = windbag
interval = 1
count = 5
earliest = -5s
latest = now
