# nginx combined access log. Sample-mode, flat rate. Stoker injects the output
# plugin; outputMode is intentionally absent.
[nginx-access.sample]
mode = sample
interval = 1
count = 20
earliest = -1s
latest = now

# Timestamp inside the [dd/Mon/yyyy:HH:MM:SS +0000] bracket.
token.0.token = \d{2}/\w{3}/\d{4}:\d{2}:\d{2}:\d{2}
token.0.replacementType = timestamp
token.0.replacement = %d/%b/%Y:%H:%M:%S

# Client IP at the start of the line.
token.1.token = ##SRCIP##
token.1.replacementType = random
token.1.replacement = ipv4

# HTTP status, weighted towards 200 via the file list.
token.2.token = ##STATUS##
token.2.replacementType = file
token.2.replacement = samples/status_codes.sample

# Response size in bytes.
token.3.token = ##BYTES##
token.3.replacementType = random
token.3.replacement = integer[180:24000]
