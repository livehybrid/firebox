name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/livehybrid/firebox
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --features tls -- -D warnings
      - name: Tests
        run: cargo test --features tls
      - name: Python parity harness
        run: |
          python3 -m pip install --quiet pytest
          cargo build --release --features tls
          FIREBOX_BIN=target/release/firebox python3 -m pytest tests/parity -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Only ring (the `tls` feature) has C to compile. musl-gcc covers the
      # native target; for arm64 the C is built with zig's bundled musl headers
      # (Ubuntu's aarch64-linux-gnu-gcc has no arm64 libc headers on the
      # runner and falls back to the host's /usr/include). The link itself is
      # rustc's bundled rust-lld either way (see .cargo/config.toml).
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: mlugg/setup-zig@v2
        if: matrix.arch == 'arm64'
        with:
          version: 0.14.1
      - name: zig cc as the arm64 C compiler
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p "$HOME/zigcc"
          printf '#!/bin/sh\nexec zig cc -target aarch64-linux-musl "$@"\n' > "$HOME/zigcc/aarch64-musl-cc"
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$HOME/zigcc/zig-ar"
          chmod +x "$HOME/zigcc/aarch64-musl-cc" "$HOME/zigcc/zig-ar"
          echo "CC_aarch64_unknown_linux_musl=$HOME/zigcc/aarch64-musl-cc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=$HOME/zigcc/zig-ar" >> "$GITHUB_ENV"
      - name: Build (static musl, with TLS)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} --features tls
      - name: Smoke the binary (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          target/${{ matrix.target }}/release/firebox version
          target/${{ matrix.target }}/release/firebox bench fixtures/packs/web-access/default/eventgen.conf --seconds 2
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/firebox dist/${{ matrix.arch }}/firebox
          tar -C target/${{ matrix.target }}/release -czf dist/firebox-${{ matrix.target }}.tar.gz firebox
      - uses: actions/upload-artifact@v4
        with:
          name: firebox-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firebox-*
          path: dist
          merge-multiple: true
      - name: Layout binaries per arch
        run: |
          ls -R dist
          test -x dist/amd64/firebox && test -x dist/arm64/firebox
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Dockerfile for prebuilt binaries
        run: |
          cat > Dockerfile.prebuilt <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY dist/${TARGETARCH}/firebox /firebox
          ENTRYPOINT ["/firebox"]
          EOF
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign the pushed digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firebox-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
